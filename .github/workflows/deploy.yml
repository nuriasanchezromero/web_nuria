name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Solo lectura del repositorio: el despliegue usa el token de Cloudflare,
# no el GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos y plantillas (astro check)
        run: npm run check

      - name: Auditoría de dependencias (informativa, no bloquea)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Compilar
        run: npm run build

      - name: Desplegar en Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configurar secretos de Supabase en el Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Faltan SUPABASE_URL o SUPABASE_ANON_KEY en los secretos del repo. El login no funcionará hasta que se añadan."
            exit 0
          fi
          node -e 'require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify({SUPABASE_URL: process.env.SUPABASE_URL, SUPABASE_ANON_KEY: process.env.SUPABASE_ANON_KEY}))'
          npx wrangler secret bulk /tmp/secrets.json --config dist/server/wrangler.json
