<div style="width: 1440px; height: 900px; background: #F6EEF3; color: #241F1C; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; position: relative; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 26px 64px;">
    <a href="#" style="font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em; text-decoration: none; color: #241F1C;">Núria Sánchez</a>

    </div>
  </div>

      <span class="sticker" style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.14em; background: #F8E3A1; color: #5A4300; padding: 8px 14px; border-radius: 999px; transform: rotate(-2deg);">Arte · historias · pintura</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 148px; line-height: 0.88; letter-spacing: -0.04em; color: #241F1C;">Núria<br>Sánchez</h1>
      <p style="margin: 0; font-size: 24px; line-height: 1.4; color: #4F4640; max-width: 520px; text-wrap: pretty;">Historias del arte contadas como un chisme. Cuadros que no existen, artistas que sí.</p>
      <div style="display: flex; gap: 14px; align-items: center;">
        <a href="#" style="font-size: 16px; font-weight: 700; text-decoration: none; color: #241F1C; background: #F5A9C8; padding: 16px 28px; border-radius: 999px; box-shadow: 0 6px 0 rgba(36, 31, 28, 0.12);">Escríbeme</a>

      </div>
    </div>

    <div style="grid-column: span 5; position: relative; height: 640px;">
      <div style="position: absolute; left: 28px; top: 26px; width: 440px; height: 580px; background: #BFE8D6; border-radius: 36px; transform: rotate(4deg);"></div>
      <div style="position: absolute; left: 8px; top: 10px; width: 440px; height: 580px; background: #D9D2F4; border-radius: 36px; transform: rotate(-3deg);"></div>
      <img src="hero.jpg" alt="Foto de Núria" style="position: absolute; left: 20px; top: 0; width: 440px; height: 580px; object-fit: cover; object-position: 50% 15%; border-radius: 36px; display: block; box-shadow: 0 24px 60px rgba(36, 31, 28, 0.18);">
      <div class="sticker" style="position: absolute; right: -24px; bottom: 18px; font-size: 120px; line-height: 1; color: #F5A9C8; -webkit-text-stroke: 6px #FFFFFF; paint-order: stroke fill; transform: rotate(-10deg); text-shadow: 0 10px 0 rgba(36, 31, 28, 0.14);">Qhè?</div>
    </div>
